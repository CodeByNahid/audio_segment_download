<!DOCTYPE html>
<html lang="en">
<head>
<link rel="shortcut icon" type="icon" href="sound.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Segment Download</title>
<style>
  :root{
    --bg:#1b2023;
    --surface:#222a2e;
    --surface-2:#283136;
    --border:#333e44;
    --text:#dbe3e4;
    --text-dim:#8fa0a4;
    --accent:#6fa89b;
    --accent-dim:#4d766c;
    --warn:#c9a26d;
    --warn-dim:#9c7c53;
    --error:#c98d6d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 28px 28px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dim);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  .sub{
    color:var(--text-dim);
    font-size:13.5px;
    margin:0 0 24px;
    line-height:1.5;
  }

  /* waveform signature */
  .wave{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:26px;
  }
  .wave span{
    width:3px;
    background:var(--accent-dim);
    border-radius:2px;
    display:block;
  }
  .wave.active span{
    animation: bar 1.1s ease-in-out infinite;
    background:var(--accent);
  }
  @keyframes bar{
    0%,100%{ transform:scaleY(.35); }
    50%{ transform:scaleY(1); }
  }

  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
    font-family:inherit;
  }
  input[type=text]:focus, input[type=number]:focus{
    border-color:var(--accent-dim);
  }
  input::placeholder{ color:#5c6a6e; }

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    transition: opacity .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  button:active{ transform: scale(.98); }
  button:disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .btn-accent{
    background:var(--accent);
    color:#132320;
  }
  .btn-accent:hover:not(:disabled){ opacity:.9; }

  .btn-warn{
    background:var(--warn);
    color:#241a0e;
    width:100%;
    padding:13px 18px;
    font-size:14.5px;
  }
  .btn-warn:hover:not(:disabled){ opacity:.9; }

  .section{
    border-top:1px solid var(--border);
    margin-top:22px;
    padding-top:20px;
  }

  .range-row{
    display:flex;
    gap:14px;
    margin-bottom:18px;
  }
  .range-field{ flex:1; }
  .range-field .unit{
    color:var(--text-dim);
    font-size:11.5px;
    margin-top:5px;
  }

  audio{
    width:100%;
    margin:16px 0 4px;
    accent-color: var(--accent);
  }
  audio::-webkit-media-controls-panel{
    background:var(--surface-2);
  }

  .status{
    font-size:12.5px;
    margin-top:14px;
    padding:10px 12px;
    border-radius:8px;
    line-height:1.5;
    display:none;
  }
  .status.show{ display:block; }
  .status.info{ background:#22322f; color:var(--accent); border:1px solid var(--accent-dim); }
  .status.error{ background:#332521; color:var(--error); border:1px solid #6b4636; }
  .status.success{ background:#22322f; color:var(--accent); border:1px solid var(--accent-dim); }

  .meta{
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }

  @media (max-width:420px){
    .card{ padding:24px 18px 20px; }
    .row{ flex-direction:column; }
    .row button{ width:100%; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">
    <div class="wave" id="wave">
      <span style="height:40%"></span>
      <span style="height:75%"></span>
      <span style="height:55%"></span>
      <span style="height:90%"></span>
      <span style="height:35%"></span>
      <span style="height:65%"></span>
      <span style="height:50%"></span>
    </div>
    audio segment tool
  </div>
  <h1>Crop an audio clip</h1>
  <p class="sub">Paste a direct audio link, load it, then set a start and end time in seconds to download just that segment.</p>

  <label for="urlInput">Link</label>
  <div class="row">
    <input type="text" id="urlInput" placeholder="Input your audio link..">
    <button class="btn-accent" id="searchBtn">Search</button>
  </div>

  <audio id="player" controls style="display:none;"></audio>
  <div class="meta" id="durationMeta"></div>

  <div id="statusBox" class="status"></div>

  <div class="section">
    <div class="range-row">
      <div class="range-field">
        <label for="startInput">Start</label>
        <input type="number" id="startInput" value="" min="0" step="0.1" placeholder="0.00">
        <div class="unit">seconds</div>
      </div>
      <div class="range-field">
        <label for="endInput">End</label>
        <input type="number" id="endInput" value="" min="0" step="0.1" placeholder="10.30">
        <div class="unit">seconds</div>
      </div>
    </div>
    <button class="btn-warn" id="downloadBtn" disabled>Download segment</button>
  </div>
</div>

<script>
const urlInput = document.getElementById('urlInput');
const searchBtn = document.getElementById('searchBtn');
const downloadBtn = document.getElementById('downloadBtn');
const startInput = document.getElementById('startInput');
const endInput = document.getElementById('endInput');
const player = document.getElementById('player');
const statusBox = document.getElementById('statusBox');
const durationMeta = document.getElementById('durationMeta');
const wave = document.getElementById('wave');

let audioCtx = null;
let decodedBuffer = null;
let sourceFilename = 'segment';

function setStatus(msg, type){
  statusBox.textContent = msg;
  statusBox.className = 'status show ' + type;
}
function clearStatus(){
  statusBox.className = 'status';
  statusBox.textContent = '';
}

function guessFilename(url){
  try{
    const clean = url.split('?')[0];
    const parts = clean.split('/');
    const last = parts[parts.length - 1] || 'audio';
    const withoutExt = last.replace(/\.[^/.]+$/, '');
    return withoutExt || 'audio';
  }catch(e){
    return 'audio';
  }
}

searchBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if(!url){
    setStatus('Paste a link first.', 'error');
    return;
  }
  decodedBuffer = null;
  downloadBtn.disabled = true;
  durationMeta.textContent = '';
  player.style.display = 'none';
  wave.classList.add('active');
  searchBtn.disabled = true;
  setStatus('Loading audio…', 'info');

  try{
    const resp = await fetch(url, { mode: 'cors' });
    if(!resp.ok){
      throw new Error('Server responded with ' + resp.status);
    }
    const arrayBuffer = await resp.arrayBuffer();

    // preview player
    const blobForPlayer = new Blob([arrayBuffer]);
    player.src = URL.createObjectURL(blobForPlayer);
    player.style.display = 'block';

    // decode for cropping
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
    decodedBuffer = decoded;
    sourceFilename = guessFilename(url);

    const mins = Math.floor(decoded.duration / 60);
    const secs = (decoded.duration % 60).toFixed(1);
    durationMeta.textContent = `Duration: ${mins}m ${secs}s · ${decoded.sampleRate} Hz · ${decoded.numberOfChannels === 1 ? 'mono' : 'stereo'}`;

    setStatus('Audio loaded. Set a start and end time, then download.', 'success');
    downloadBtn.disabled = false;
  }catch(err){
    console.error(err);
    setStatus('Could not load that link. It may not allow cross-origin access, or the URL is invalid. (' + err.message + ')', 'error');
  }finally{
    wave.classList.remove('active');
    searchBtn.disabled = false;
  }
});

function audioBufferToWav(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = numFrames * blockAlign;

  const bufferOut = new ArrayBuffer(44 + dataSize);
  const view = new DataView(bufferOut);

  function writeString(offset, str){
    for(let i=0;i<str.length;i++){
      view.setUint8(offset+i, str.charCodeAt(i));
    }
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytesPerSample * 8, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  const channelData = [];
  for(let ch=0; ch<numChannels; ch++){
    channelData.push(buffer.getChannelData(ch));
  }

  let offset = 44;
  for(let i=0; i<numFrames; i++){
    for(let ch=0; ch<numChannels; ch++){
      let sample = channelData[ch][i];
      sample = Math.max(-1, Math.min(1, sample));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }

  return new Blob([bufferOut], { type: 'audio/wav' });
}

downloadBtn.addEventListener('click', () => {
  if(!decodedBuffer){
    setStatus('Load an audio link first.', 'error');
    return;
  }
  let start = parseFloat(startInput.value);
  let end = parseFloat(endInput.value);

  if(isNaN(start) || isNaN(end)){
    setStatus('Enter valid start and end times.', 'error');
    return;
  }
  start = Math.max(0, start);
  end = Math.min(decodedBuffer.duration, end);

  if(end <= start){
    setStatus('End time must be greater than start time.', 'error');
    return;
  }

  const sampleRate = decodedBuffer.sampleRate;
  const startSample = Math.floor(start * sampleRate);
  const endSample = Math.floor(end * sampleRate);
  const frameCount = endSample - startSample;

  const cropped = audioCtx.createBuffer(
    decodedBuffer.numberOfChannels,
    frameCount,
    sampleRate
  );

  for(let ch=0; ch<decodedBuffer.numberOfChannels; ch++){
    const sourceData = decodedBuffer.getChannelData(ch).subarray(startSample, endSample);
    cropped.copyToChannel(sourceData, ch);
  }

  const wavBlob = audioBufferToWav(cropped);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(wavBlob);
  a.download = `${sourceFilename}_${start}s-${end}s.wav`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setStatus(`Downloaded segment ${start}s – ${end}s.`, 'success');
});
</script>

</body>
</html>
